[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-billing"
version = "0.1.0"
description = "AI-native billing orchestration — runnable prototype with LangGraph, Temporal, and Langfuse"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.12",
    "instructor>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "langgraph>=0.2",
    "temporalio>=1.7",
    "langfuse>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_billing"]
