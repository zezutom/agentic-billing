[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-billing"
version = "0.1.0"
description = "AI-native billing orchestration — runnable prototype with LangGraph, Temporal, and Langfuse"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.12",
    "instructor>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "langgraph>=0.2",
    "temporalio>=1.7",
    "langfuse>=2.0",
]

[project.optional-dependencies]
# The commercial-consistency auditor is self-contained and needs no LLM key.
audit = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]
# Optional: headless-browser fallback for JavaScript-only pricing pages.
audit-js = [
    "playwright>=1.40",
]

[project.scripts]
promise-audit = "promise_audit.cli:main"
promise-audit-batch = "promise_audit.experiment.run_batch:main"
promise-audit-report = "promise_audit.experiment.report:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_billing", "src/promise_audit"]
